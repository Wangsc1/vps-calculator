<!doctype html>
<html lang="zh-CN" data-theme="dark" data-repo="https://github.com/Wangsc1/vps-calculator">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#181818">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="简洁、准确、隐私友好的 VPS 剩余价值计算器，支持实时汇率、交易溢价和卡片导出。">
  <meta property="og:title" content="VPS Value · 剩余价值计算器">
  <meta property="og:description" content="计算 VPS 剩余天数、折算价值与交易价格。">
  <title>VPS Value · 剩余价值计算器</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css?v=20261001-1">
  <script>
    (() => {
      let saved = 'system';
      try { saved = localStorage.getItem('vps-value-theme') || 'system'; } catch (_) {}
      if (!['system','light','dark'].includes(saved)) saved = 'system';
      const dark = saved === 'dark' || (saved === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      const theme = dark ? 'dark' : 'light';
      const color = dark ? '#181818' : '#f4f7fb';
      document.documentElement.dataset.theme = theme;
      document.documentElement.dataset.themeMode = saved;
      document.documentElement.style.colorScheme = theme;
      document.documentElement.style.backgroundColor = color;
      document.querySelector('meta[name="theme-color"]').content = color;
      document.querySelector('meta[name="color-scheme"]').content = theme;
    })();
  </script>
</head>
<body>
  <div class="safari-tint safari-tint-top" aria-hidden="true"></div>
  <div class="safari-tint safari-tint-bottom" aria-hidden="true"></div>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <div class="grid-noise" aria-hidden="true"></div>

  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="剩余价值计算器首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48"><path d="M11 10.5h26a5.5 5.5 0 0 1 5.5 5.5v16a5.5 5.5 0 0 1-5.5 5.5H11A5.5 5.5 0 0 1 5.5 32V16A5.5 5.5 0 0 1 11 10.5Z"/><path d="M12 18h12M12 25h7"/><circle cx="34" cy="20" r="2"/><circle cx="34" cy="28" r="2"/></svg>
        </span>
        <span>
          <strong>剩余价值计算器</strong>
        </span>
      </a>
      <div class="top-actions">
        <button class="icon-button" id="resetButton" type="button" title="重置数据" aria-label="重置数据">
          <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.343-5.657"/><path d="M4 4v4h4"/></svg>
        </button>
        <button class="theme-button" id="themeButton" type="button" aria-label="切换外观" title="切换外观">
          <span class="theme-track"><span class="theme-thumb">
            <svg class="system" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
            <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg>
            <svg class="moon" viewBox="0 0 24 24"><path d="M20 15.2A8.4 8.4 0 0 1 8.8 4 8.5 8.5 0 1 0 20 15.2Z"/></svg>
          </span></span>
        </button>
      </div>
    </header>

    <main class="calculator" id="calculator">
      <section class="panel input-panel">
        <div class="section-heading">
          <div><span class="eyebrow">输入</span><h1>计算参数</h1></div>
          <span class="privacy-pill"><i></i> 数据仅保存在本机</span>
        </div>

        <div class="field-grid two">
          <div class="field">
            <label for="price">续费金额 <span id="priceCny">≈ ¥0.00</span></label>
            <div class="input-wrap money-input">
              <b id="currencySymbol">$</b>
              <input id="price" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00">
            </div>
          </div>
          <div class="field">
            <label for="currency">结算币种</label>
            <div class="input-wrap select-wrap">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
              <select id="currency">
                <option value="USD">USD · 美元</option><option value="EUR">EUR · 欧元</option>
                <option value="GBP">GBP · 英镑</option><option value="JPY">JPY · 日元</option>
                <option value="HKD">HKD · 港币</option><option value="TWD">TWD · 新台币</option>
                <option value="SGD">SGD · 新加坡元</option><option value="AUD">AUD · 澳元</option>
                <option value="CAD">CAD · 加元</option><option value="CNY">CNY · 人民币</option>
              </select>
            </div>
          </div>
        </div>

        <fieldset class="field cycle-field">
          <legend>付款周期</legend>
          <div class="cycle-options" id="cycleOptions">
            <button type="button" data-days="30">月付</button><button type="button" data-days="90">季付</button>
            <button type="button" data-days="180">半年</button><button type="button" data-days="365" class="active">年付</button>
            <button type="button" data-days="730">两年</button><button type="button" data-days="1095">三年</button>
          </div>
        </fieldset>

        <div class="field-grid two">
          <div class="field">
            <label for="tradeDate">交易日期</label>
            <div class="input-wrap date-wrap">
              <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
              <input id="tradeDate" type="date">
            </div>
          </div>
          <div class="field">
            <label for="dueDate">到期日期</label>
            <div class="input-wrap date-wrap">
              <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
              <input id="dueDate" type="date">
            </div>
          </div>
        </div>

        <div class="rate-card">
          <div class="rate-info">
            <span class="rate-icon"><svg viewBox="0 0 24 24"><path d="m4 16 5-5 4 4 7-8"/><path d="M15 7h5v5"/></svg></span>
            <div><label for="rate">人民币汇率</label><small id="rateStatus">选择币种后自动获取</small></div>
          </div>
          <div class="rate-controls">
            <span>1 <b id="rateCurrency">USD</b> =</span>
            <input id="rate" type="number" min="0" step="0.0001" inputmode="decimal" value="7.0000">
            <span>CNY</span>
            <button id="refreshRate" type="button" title="刷新汇率" aria-label="刷新汇率">
              <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.343-5.657"/><path d="M4 4v4h4"/></svg>
            </button>
          </div>
        </div>
      </section>
      <section class="panel result-panel">
        <div class="result-head">
          <div><span class="eyebrow">结果</span><h2 id="resultTitle">当前剩余价值</h2></div>
          <span class="status-chip" id="statusChip">计算中</span>
        </div>

        <div class="hero-value">
          <span class="currency-mark">¥</span><strong id="remainingCny">0.00</strong>
          <button id="copyAmount" type="button" aria-label="复制剩余价值" title="复制金额">
            <svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
          </button>
          <small id="remainingOriginal">≈ 0.00 USD</small>
        </div>

        <div class="progress-block">
          <div class="progress-meta"><span><i></i>剩余周期</span><strong id="progressPercent">0%</strong></div>
          <div class="progress-track"><span id="progressBar"></span></div>
          <div class="progress-caption"><span><b id="daysRemaining">0</b> 天剩余</span><span id="dueCaption">未选择到期日</span></div>
        </div>

        <div class="deal-card">
          <div class="deal-heading"><div><span>交易估值</span><small>任意输入一项，另一项自动计算</small></div><span class="deal-badge" id="dealBadge">原价转让</span></div>
          <div class="deal-fields">
            <label><span>溢价 / 折价</span><div><b>¥</b><input id="premium" type="number" step="0.01" inputmode="decimal" placeholder="0.00"></div></label>
            <label><span>售出价格</span><div><b>¥</b><input id="salePrice" type="number" step="0.01" inputmode="decimal" placeholder="0.00"></div></label>
          </div>
        </div>

        <div class="action-grid">
          <button id="copyDetails" type="button" class="button secondary"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>复制结果</button>
          <button id="exportImage" type="button" class="button primary" title="导出卡片" aria-label="导出卡片"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m21 15-5-5L5 20"/></svg>导出卡片</button>
        </div>
      </section>
    </main>

    <footer>
      <p>计算结果仅供交易参考 · 汇率来自 <a href="https://www.frankfurter.app/" target="_blank" rel="noopener">Frankfurter</a></p>
      <p><a id="githubLink" href="https://github.com/" target="_blank" rel="noopener">GitHub</a> · Apache-2.0</p>
    </footer>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <dialog id="imageDialog">
    <div class="dialog-head"><div><strong>分享卡片</strong><small id="imageStatus" role="status" aria-live="polite"></small></div><button id="closeDialog" aria-label="关闭">×</button></div>
    <div class="image-stage" id="imageStage"><span class="spinner"></span><img id="generatedImage" alt="VPS 剩余价值分享卡片"></div>
    <div class="dialog-actions"><a id="downloadImage" class="button primary" download="vps-value.png">下载 PNG</a><button id="nativeShare" class="button secondary" type="button">系统分享</button></div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js" defer></script>
  <script src="./app.js?v=20261001-3" defer></script>
</body>
</html>
